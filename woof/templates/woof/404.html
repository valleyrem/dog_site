<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found</title>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;700&family=Paytone+One&display=swap" rel="stylesheet">

    <style>
    :root {
        --color-bg: #FFFFFF;
        --color-text-primary: #1c2b27;
        --color-text-secondary: #5a6a65;

        --color-accent: #FF8EED;
        --color-accent-deep: #e96fd8;
        --color-yellow: #FDDA0A;

        --color-button-background: #FFFFFF;
        --color-frame: #45494D;
        --color-white: #FFFFFF;
    }

    body {
        margin: 0;
        padding: 0;
        font-family: "Baloo 2", system-ui, sans-serif;
        background: var(--color-bg);
        color: var(--color-text-primary);

        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
    }

    .container {
        text-align: center;
        padding: 40px;
        position: relative;
        z-index: 2;
        max-width: 500px;
    }

    h1 {
        font-size: 110px;
        margin: 0;
        color: var(--color-accent);
        -webkit-text-stroke: 2.5px var(--color-text-primary);
        text-shadow: 6px 6px 0 var(--color-yellow);
        letter-spacing: 4px;
        line-height: 1;
        font-family: "Baloo 2", system-ui, sans-serif;
    }

    p {
        font-size: 24px;
        margin: 20px 0 20px;
        color: var(--color-text-secondary);
        line-height: 1.5;
    }

    .hint {
        font-size: 14px;
        opacity: 0.7;
        margin-bottom: 40px;
    }

    a {
        display: inline-block;
        color: #161616;
        text-decoration: none;
        font-size: 15px;
        font-weight: 600;
        background-color: var(--color-button-background);
        border: 1px solid var(--color-frame);
        border-right-width: 3px;
        border-bottom-width: 3px;
        padding: 10px 25px;
        border-radius: 20px;
        transition: all 0.2s ease;
    }

    a:hover {
        background-color: var(--color-accent);
        color: var(--color-white);
        border-color: var(--color-frame);
        transform: translateY(-2px);
    }

    </style>
</head>

<body>

    <div class="container">
        <h1>404</h1>

        <p>
            ¯\_(ツ)_/¯<br>
            The page you’re looking for doesn’t exist<br>
            or may have been moved.
        </p>

        <p class="hint">
            You can return to the homepage and continue exploring dog breeds.
        </p>

        <a href="{% url 'home' %}">Go Back Home</a>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page Not Found</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Manrope:wght@200..800&family=Outfit:wght@100..900&family=Space+Grotesk:wght@300..700&family=Urbanist:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;700&family=Clash+Display:wght@500;600;700&display=swap" rel="stylesheet">

    <style>

    :root {
        --bg: #fffdf8;

        --text: #1c2b27;
        --text-soft: #5d6764;

        --pink: #C4A1FF;
        --yellow: #fdda0a;
        --blue: #6ea8ff;
        --mint: #d7ffd9;
        --lavender: #efe6ff;

        --border: #161616;
        --white: #ffffff;
    }

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;

        font-family: "Baloo 2", sans-serif;
        color: var(--text);

        background:
            radial-gradient(circle at top left, var(--lavender) 0%, transparent 30%),
            radial-gradient(circle at bottom right, var(--mint) 0%, transparent 30%),
            var(--bg);

        overflow: hidden;

        display: flex;
        justify-content: center;
        align-items: center;

        padding: 20px;
    }

    body::before {
        content: "";

        position: fixed;
        inset: 0;

        background-image:
            linear-gradient(rgba(28,43,39,0.06) 1px, transparent 1px),
            linear-gradient(90deg, rgba(28,43,39,0.06) 1px, transparent 1px);

        background-size: 100px 100px;

        pointer-events: none;
        z-index: 0;
    }

    .wrapper {
        position: relative;
        z-index: 2;

        width: 100%;
        max-width: 720px;
    }

    .card {
        position: relative;
        padding: 50px 40px;
        text-align: center;
        overflow: hidden;
    }


    h1 {
        margin: 0;

        font-size: clamp(130px, 18vw, 160px);
        line-height: 0.9;

        font-family: "Space Grotesk", sans-serif;
        font-weight: 700;

        color: var(--pink);

        -webkit-text-stroke: 3px var(--border);

        text-shadow:
            6px 6px 0 var(--yellow);
    }

    .paw {
        font-size: 38px;
        margin: 15px 0 10px;
        display: inline-block;
        transform: rotate(-12deg);
    }

    .title {
        font-size: 32px;
        font-weight: 700;
        line-height: 1.1;

        margin: 0 0 18px;

        font-family: "Space Grotesk", sans-serif;
    }

    .description {
        font-size: 21px;
        line-height: 1.5;

        color: var(--text-soft);
        font-family: "Space Grotesk", sans-serif;

        margin: 0 auto 18px;

        max-width: 520px;
    }

    .hint {
        font-size: 15px;
        line-height: 1.5;

        color: var(--text-soft);
        font-family: "Space Grotesk", sans-serif;

        opacity: 0.85;

        margin-bottom: 35px;
    }

    .home-btn {
        display: inline-flex;
        align-items: center;
        gap: 10px;

        text-decoration: none;

        background: var(--white);

        border: 3px solid var(--border);

        padding: 12px 26px;

        font-family: "Space Grotesk", sans-serif;
        font-size: 16px;
        font-weight: 600;

        color: var(--text);

        box-shadow: 4px 4px 0 var(--border);

        transition:
            transform 0.18s ease,
            box-shadow 0.18s ease,
            background 0.18s ease;
    }

    .home-btn:hover {

        background: var(--pink);
    }

    .dog-face {
        margin-top: 30px;

        font-size: 52px;
        line-height: 1;
    }

    @media (max-width: 768px) {

        .card {
            padding: 38px 24px;
        }

        .title {
            font-size: 25px;
        }

        .description {
            font-size: 18px;
        }

        .hint {
            font-size: 14px;
        }

        .home-btn {
            width: 100%;
            justify-content: center;
        }
    }

    </style>
</head>

<body>

<div class="wrapper">

    <div class="card">

        <h1>404</h1>

        <div class="paw">🐾</div>

        <h2 class="title">
            This page ran away.
        </h2>

        <p class="description">
            The page you’re looking for doesn’t exist,
            may have been moved,
            or is still chasing squirrels somewhere else.
        </p>

        <p class="hint">
            Return to the homepage and continue exploring dog breeds.
        </p>

        <a href="{% url 'home' %}" class="home-btn">
            ← Back Home
        </a>

        <div class="dog-face">
            UᵔᴥᵔU
        </div>

    </div>

</div>

</body>
</html>

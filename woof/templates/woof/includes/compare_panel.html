{% load i18n %}
<!-- Compare dogs -->
<div class="compare-section" id="compare"{% if hidden %} hidden{% endif %}>

    <div id="comparePanel" class="compare-panel hidden">

        <div class="compare-wrap">

        <div class="compare-controls">

            <div id="breedA" data-id="{{ post.id }}" hidden></div>

            <span class="compare-with">{% trans "Compare with" %}</span>

            <div id="breedBCustom" class="custom-select">
                <button type="button"
                        id="breedBTrigger"
                        class="custom-select-trigger"
                        aria-haspopup="listbox"
                        aria-expanded="false">
                    <span class="custom-select-value">
                        <img id="breedBTriggerImg"
                             class="custom-select-img"
                             alt=""
                             hidden>
                        <span id="breedBTriggerText"
                              class="custom-select-placeholder">{% trans "Select breed" %}</span>
                    </span>
                    <span class="custom-select-caret" aria-hidden="true"></span>
                </button>

                <button type="button"
                        id="breedBClear"
                        class="custom-select-clear"
                        title="{% trans 'Clear' %}"
                        aria-label="{% trans 'Clear' %}"
                        hidden>
                    <svg width="11" height="11" viewBox="0 0 15 15" fill="none" aria-hidden="true"><path d="M1.5 1.5 L13.5 13.5 M13.5 1.5 L1.5 13.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
                </button>

                {# Filled by scripts.js from the <select> below (one list, not two). #}
                <ul id="breedBList"
                    data-list-search="{% trans 'Search' %}"
                    data-list-empty="{% trans 'No breeds match these filters' %}"
                    class="custom-select-list"
                    role="listbox"
                    tabindex="-1"
                    hidden></ul>
            </div>

            <select id="breedB"
                    class="compare-select"
                    title="{% trans 'Select breed' %}"
                    hidden
                    aria-hidden="true">
                <option value="">{% trans "Select breed" %}</option>

                {% for dog in all_breeds %}
                    {% if dog.id != post.id %}
                        <option value="{{ dog.id }}"{% if dog.photo %} data-thumb="{{ dog.photo_thumb.url }}"{% endif %}>
                            {{ dog.title }}
                        </option>
                    {% endif %}
                {% endfor %}
            </select>

        </div>

        <button type="button" class="guide-more compare-open" data-compare-open disabled>{% trans "Compare" %}</button>

        </div>

    </div>

</div>

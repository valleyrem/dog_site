{% load i18n %}

<!-- Contents of the guide: links are added from the section titles already
     on the page, so the list can never drift away from the text. -->
<nav class="guide-toc is-collapsed" aria-label="{% trans 'Contents' %}">
    <p class="guide-toc__title">{% trans "Contents" %}</p>
    <div class="guide-toc__list" data-guide-toc-list></div>
    <button type="button" class="guide-toc__toggle" aria-expanded="false" data-guide-toc-toggle hidden>
        <span class="guide-toc__more">{% blocktranslate trimmed %}Show all contents{% endblocktranslate %}</span>
        <span class="guide-toc__less">{% blocktranslate trimmed %}Show less{% endblocktranslate %}</span>
        <span class="guide-toc__arrow" aria-hidden="true"></span>
    </button>
</nav>

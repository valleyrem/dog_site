{% load i18n %}
{% comment %}The comparison table of a breed page: outside the page text, so it is set
the same as the one on the breeds page.{% endcomment %}
<dialog class="bc-dialog" tabindex="-1" data-bc-dialog aria-labelledby="bcTitle">
    <div class="bc-dialog__head">
        <h2 class="bc-dialog__title" id="bcTitle">{% trans "Compare" %}</h2>
        <button type="button" class="bc-dialog__close" data-bc-close aria-label="{% trans 'Close' %}"><svg width="15" height="15" viewBox="0 0 15 15" fill="none" aria-hidden="true"><path d="M1.5 1.5 L13.5 13.5 M13.5 1.5 L1.5 13.5" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/></svg></button>
    </div>
    <div class="bc-dialog__body"
         data-bc-table
         data-i18n-varieties="{% trans 'Varieties' %}"
         data-i18n-origin="{% trans 'Origin' %}"
         data-i18n-size="{% trans 'Size' %}"
         data-i18n-height="{% trans 'Height' %}"
         data-i18n-weight="{% trans 'Weight' %}"
         data-i18n-coat-type="{% trans 'Coat type' %}"
         data-i18n-coat-length="{% trans 'Coat length' %}"
         data-i18n-life="{% trans 'Life expectancy' %}"
         data-i18n-trainability="{% trans 'Trainability' %}"
         data-i18n-activity="{% trans 'Activity' %}"
         data-i18n-barking="{% trans 'Barking' %}"
         data-i18n-allergy="{% trans 'Shedding' %}"
         data-i18n-family="{% trans 'Family friendly' %}"
         data-i18n-years="{% trans 'years' %}"></div>
</dialog>
